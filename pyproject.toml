[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonebook"
version = "0.1.0"
description = "Japanese corporate names to katakana readings: a small, calibrated G2P model built for unseen entities, able to answer 'unknown'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phonebook contributors" }]
keywords = ["japanese", "g2p", "katakana", "corporate-names", "grapheme-to-phoneme"]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "jaconv>=0.3",
    "tqdm>=4.65",
    "requests>=2.31",
]

[project.optional-dependencies]
data = ["datasets>=2.16", "huggingface_hub>=0.20", "pandas>=2.0"]
baselines = ["pyopenjtalk>=0.3", "fugashi>=1.3", "unidic-lite>=1.0", "anthropic>=0.40"]
figures = ["matplotlib>=3.7"]
app = ["gradio>=4.0"]
export = ["onnx>=1.15", "onnxruntime>=1.16"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "psutil>=5.9"]
all = [
    "datasets>=2.16", "huggingface_hub>=0.20", "pandas>=2.0",
    "pyopenjtalk>=0.3", "fugashi>=1.3", "unidic-lite>=1.0", "anthropic>=0.40",
    "matplotlib>=3.7", "gradio>=4.0", "onnx>=1.15", "onnxruntime>=1.16",
    "pytest>=7.4", "psutil>=5.9",
]

[project.scripts]
phonebook = "phonebook.cli:main"

[tool.setuptools.packages.find]
include = ["phonebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
